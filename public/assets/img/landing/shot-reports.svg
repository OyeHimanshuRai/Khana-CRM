<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="r-area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fb923c" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fb923c" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" rx="18" fill="#f8fafc"/>
  <text x="24" y="38" font-size="15" font-weight="700" fill="#0f172a">Reports · October</text>
  <rect x="470" y="20" width="148" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="544" y="37" font-size="10.5" fill="#334155" text-anchor="middle">Export to Tally ↓</text>
  <!-- KPIs -->
  <g font-size="10.5">
    <rect x="24" y="60" width="140" height="70" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="38" y="82" fill="#64748b">Sales</text><text x="38" y="110" font-size="20" font-weight="700" fill="#0f172a">₹4.86 L</text>
    <rect x="174" y="60" width="140" height="70" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="188" y="82" fill="#64748b">Bills</text><text x="188" y="110" font-size="20" font-weight="700" fill="#0f172a">1,284</text>
    <rect x="324" y="60" width="140" height="70" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="338" y="82" fill="#64748b">Food cost</text><text x="338" y="110" font-size="20" font-weight="700" fill="#0f172a">31.4%</text>
    <rect x="474" y="60" width="142" height="70" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="488" y="82" fill="#64748b">GST payable</text><text x="488" y="110" font-size="20" font-weight="700" fill="#c2410c">₹23.1K</text>
  </g>
  <!-- trend -->
  <rect x="24" y="144" width="380" height="234" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="38" y="166" font-size="11" fill="#64748b">Daily sales</text>
  <g stroke="#f1f5f9"><line x1="38" y1="200" x2="390" y2="200"/><line x1="38" y1="250" x2="390" y2="250"/><line x1="38" y1="300" x2="390" y2="300"/><line x1="38" y1="350" x2="390" y2="350"/></g>
  <path d="M38 320 L80 300 L122 310 L164 270 L206 280 L248 236 L290 250 L332 214 L374 196 L390 200 L390 350 L38 350 Z" fill="url(#r-area)"/>
  <polyline points="38,320 80,300 122,310 164,270 206,280 248,236 290,250 332,214 374,196 390,200" fill="none" stroke="#c2410c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- top dishes -->
  <rect x="414" y="144" width="202" height="234" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="428" y="166" font-size="11" fill="#64748b">Top dishes</text>
  <g font-size="10.5" fill="#0f172a">
    <text x="428" y="192">Paneer Tikka</text><rect x="428" y="198" width="160" height="8" rx="4" fill="#fed7aa"/><rect x="428" y="198" width="140" height="8" rx="4" fill="#c2410c"/>
    <text x="428" y="226">Butter Chicken</text><rect x="428" y="232" width="160" height="8" rx="4" fill="#fed7aa"/><rect x="428" y="232" width="118" height="8" rx="4" fill="#ea580c"/>
    <text x="428" y="260">Dal Makhani</text><rect x="428" y="266" width="160" height="8" rx="4" fill="#fed7aa"/><rect x="428" y="266" width="96" height="8" rx="4" fill="#f97316"/>
    <text x="428" y="294">Garlic Naan</text><rect x="428" y="300" width="160" height="8" rx="4" fill="#fed7aa"/><rect x="428" y="300" width="84" height="8" rx="4" fill="#fb923c"/>
    <text x="428" y="328">Masala Chaas</text><rect x="428" y="334" width="160" height="8" rx="4" fill="#fed7aa"/><rect x="428" y="334" width="62" height="8" rx="4" fill="#fdba74"/>
