<svg xmlns="http://www.w3.org/2000/svg" width="400" height="280" viewBox="0 0 400 280" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="b-or" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" rx="20" fill="#fff7ed"/>
  <!-- receipt coming out of the printer -->
  <path d="M74 30 h132 v150 l-11 8 -11 -8 -11 8 -11 -8 -11 8 -11 -8 -11 8 -11 -8 -11 8 -11 -8 -11 8 -11 -8 Z" fill="#ffffff" stroke="#e5e7eb"/>
  <g font-size="9.5" fill="#111827">
    <text x="140" y="50" font-size="11" font-weight="700" text-anchor="middle">TAX INVOICE</text>
    <text x="140" y="63" fill="#6b7280" text-anchor="middle">GSTIN 27ABCDE1234F1Z5</text>
    <line x1="84" y1="71" x2="196" y2="71" stroke="#e5e7eb" stroke-dasharray="3 3"/>
    <text x="86" y="86">Paneer Tikka</text><text x="194" y="86" text-anchor="end">280.00</text>
    <text x="86" y="100">Garlic Naan ×3</text><text x="194" y="100" text-anchor="end">210.00</text>
    <text x="86" y="114" fill="#6b7280">CGST 2.5%</text><text x="194" y="114" fill="#6b7280" text-anchor="end">11.67</text>
    <text x="86" y="128" fill="#6b7280">SGST 2.5%</text><text x="194" y="128" fill="#6b7280" text-anchor="end">11.67</text>
    <line x1="84" y1="136" x2="196" y2="136" stroke="#e5e7eb" stroke-dasharray="3 3"/>
    <text x="86" y="154" font-size="12" font-weight="700">Total</text><text x="194" y="154" font-size="12" font-weight="700" text-anchor="end">₹490</text>
    <text x="140" y="172" fill="#6b7280" text-anchor="middle">Thank you, visit again!</text>
  </g>
  <!-- thermal printer (the billing machine) -->
  <rect x="50" y="176" width="180" height="78" rx="16" fill="#374151"/>
  <rect x="64" y="182" width="152" height="10" rx="5" fill="#111827"/>
  <rect x="70" y="210" width="60" height="8" rx="4" fill="#4b5563"/>
  <circle cx="198" cy="226" r="8" fill="url(#b-or)"/>
  <circle cx="176" cy="226" r="4" fill="#22c55e"/>
  <!-- UPI tile -->
  <rect x="252" y="62" width="122" height="150" rx="16" fill="#ffffff" stroke="#fed7aa" stroke-width="2"/>
  <text x="313" y="88" font-size="11" font-weight="700" fill="#111827" text-anchor="middle">Pay ₹490</text>
  <g transform="translate(283 98)" fill="#111827">
    <rect width="60" height="60" rx="4" fill="#fff" stroke="#111827" stroke-width="2"/>
    <rect x="6" y="6" width="16" height="16" rx="2"/><rect x="10" y="10" width="8" height="8" fill="#fff"/>
    <rect x="38" y="6" width="16" height="16" rx="2"/><rect x="42" y="10" width="8" height="8" fill="#fff"/>
    <rect x="6" y="38" width="16" height="16" rx="2"/><rect x="10" y="42" width="8" height="8" fill="#fff"/>
    <rect x="30" y="30" width="6" height="6" fill="#c2410c"/><rect x="42" y="40" width="6" height="6"/><rect x="30" y="44" width="6" height="6"/>
  </g>
  <g font-size="9.5" font-weight="700" text-anchor="middle">
    <rect x="262" y="170" width="32" height="18" rx="9" fill="#ecfdf5"/><text x="278" y="183" fill="#15803d">UPI</text>
    <rect x="298" y="170" width="34" height="18" rx="9" fill="#eff6ff"/><text x="315" y="183" fill="#1d4ed8">Card</text>
    <rect x="336" y="170" width="30" height="18" rx="9" fill="#fff7ed"/><text x="351" y="183" fill="#c2410c">Cash</text>
  </g>
  <text x="313" y="204" font-size="9" fill="#6b7280" text-anchor="middle">Split the bill any way</text>
</svg>
