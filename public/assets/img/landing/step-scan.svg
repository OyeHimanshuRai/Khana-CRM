  <text x="155" y="118" font-size="11" font-weight="700" fill="#c2410c" text-anchor="middle">SCAN TO ORDER</text>
  <g transform="translate(125 128)" fill="#111827">
    <rect x="0" y="0" width="60" height="60" rx="4" fill="#fff" stroke="#111827" stroke-width="2"/>
    <rect x="6" y="6" width="16" height="16" rx="2"/><rect x="10" y="10" width="8" height="8" fill="#fff"/>
    <rect x="38" y="6" width="16" height="16" rx="2"/><rect x="42" y="10" width="8" height="8" fill="#fff"/>
    <rect x="6" y="38" width="16" height="16" rx="2"/><rect x="10" y="42" width="8" height="8" fill="#fff"/>
    <rect x="28" y="8" width="5" height="5"/><rect x="28" y="20" width="5" height="5"/><rect x="34" y="30" width="5" height="5"/>
    <rect x="42" y="36" width="5" height="5"/><rect x="48" y="46" width="5" height="5"/><rect x="30" y="44" width="5" height="5"/>
    <rect x="40" y="50" width="5" height="5"/><rect x="28" y="34" width="5" height="5" fill="#c2410c"/>
  </g>
  <text x="155" y="200" font-size="10" fill="#6b7280" text-anchor="middle">Table 4</text>
  <!-- phone scanning -->
