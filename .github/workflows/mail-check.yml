name: Mail configuration check (read-only, manual)

# One-off helper, run by hand. Never runs on push. Reads only; changes nothing.
# Prints no password, key or token.

on:
  workflow_dispatch:

jobs:
  check:
    name: Check mail settings on the server
    runs-on: ubuntu-latest
    steps:
      - name: Inspect server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd ${{ secrets.VPS_PROJECT_PATH }}
            echo "### 1. .env mail keys (no password)"
            grep -E "^MAIL_(MAILER|SCHEME|HOST|PORT|USERNAME|FROM_ADDRESS|FROM_NAME)=" .env || echo "(none set)"
            echo "### 2. settings the admin panel overrides with (no password)"
            cat > /tmp/mail_check.php <<'PHP'
            foreach (['mail.default','mail.mailers.smtp.host','mail.mailers.smtp.port','mail.mailers.smtp.username','mail.mailers.smtp.scheme','mail.from.address','mail.from.name'] as $k) {
              echo str_pad($k, 32)." = ".var_export(config($k), true)."\n";
            }
            echo "smtp password set: ".(filled(config('mail.mailers.smtp.password')) ? 'yes' : 'no')."\n";
            echo "recent senders used (email_logs): ".json_encode(\Illuminate\Support\Facades\DB::table('email_logs')->select('from_email', \Illuminate\Support\Facades\DB::raw('count(*) n'))->groupBy('from_email')->get())."\n";
            PHP
            php artisan tinker --execute="$(cat /tmp/mail_check.php)"
            rm -f /tmp/mail_check.php
            echo "### 3. files on the server that still contain the old company name (list only)"
            grep -rIil "oldco" . --exclude-dir=vendor --exclude-dir=node_modules --exclude-dir=.git 2>/dev/null | head -20 || true
            echo "### 3b. any other site folder using that mail host"
            grep -rIl "mail.oldco" /var/www --exclude-dir=vendor --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=logs 2>/dev/null | head -10 || true
            echo "### DONE"
