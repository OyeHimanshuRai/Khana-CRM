name: Remove the test companies (manual, soft delete)

# One-off, run by hand. Never runs on push. Soft-removes the listed companies: each is switched off,
# its staff are deactivated and signed out, its branches and itself are soft-deleted (every record
# stays in the database and can be restored). Each id is only touched when its name matches, and the
# platform's own company (code MAIN) is never touched.

on:
  workflow_dispatch:

jobs:
  run:
    name: Remove
    runs-on: ubuntu-latest
    steps:
      - name: Run on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd ${{ secrets.VPS_PROJECT_PATH }}
            php artisan tinker --execute="echo 'companies before: '.\App\Models\Tenant::count().PHP_EOL; \$map = [5 => 'bikasweets', 17 => 'Deepak', 16 => 'Side Restra', 7 => 'test', 13 => 'test', 14 => 'Test', 15 => 'test']; foreach (\$map as \$id => \$name) { \$t = \App\Models\Tenant::query()->find(\$id); if (!\$t || \$t->name !== \$name || \$t->code === 'MAIN') { echo 'SKIP '.\$id.' ('.\$name.') - not found or does not match'.PHP_EOL; continue; } \Illuminate\Support\Facades\DB::transaction(function () use (\$t) { \$t->forceFill(['is_active' => false])->save(); \$users = \App\Models\User::query()->withoutGlobalScopes()->where('tenant_id', \$t->id); \$ids = (clone \$users)->pluck('id')->all(); \$users->update(['is_active' => false]); \App\Models\User::query()->withoutGlobalScopes()->where('current_tenant_id', \$t->id)->update(['current_tenant_id' => null]); if (\$ids) { \Illuminate\Support\Facades\DB::table('sessions')->whereIn('user_id', \$ids)->delete(); } \App\Models\Shop::query()->withoutGlobalScopes()->where('tenant_id', \$t->id)->get()->each->delete(); \$t->delete(); }); echo 'REMOVED '.\$id.' '.\$name.PHP_EOL; } echo 'companies after: '.\App\Models\Tenant::count().PHP_EOL; echo 'in-house still there: '.\App\Models\Tenant::query()->where('code', 'MAIN')->exists().PHP_EOL;"
            echo "### DONE"
