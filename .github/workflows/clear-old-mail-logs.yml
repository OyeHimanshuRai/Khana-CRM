name: Delete the old company's mail log rows (manual)

# One-off helper, run by hand. Never runs on push.
# Deletes ONLY email_logs / failed_jobs rows that name the previous company
# (sender, subject or error text). Every other row is left alone.

on:
  workflow_dispatch:

jobs:
  clear:
    name: Delete old mail log rows
    runs-on: ubuntu-latest
    steps:
      - name: Update on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd ${{ secrets.VPS_PROJECT_PATH }}
            cat > /tmp/clear_logs.php <<'PHP'
            use Illuminate\Support\Facades\DB;
            DB::transaction(function () {
              $mail = DB::table('email_logs')->where(function ($q) {
                $q->whereRaw('LOWER(from_email) LIKE ?', ['%oldco%'])->orWhereRaw('LOWER(from_name) LIKE ?', ['%oldco%'])->orWhereRaw('LOWER(subject) LIKE ?', ['%oldco%']);
              });
              echo "email_logs matching: ".(clone $mail)->count()." of ".DB::table('email_logs')->count()." total\n";
              echo "email_logs deleted: ".$mail->delete()."\n";
              $jobs = DB::table('failed_jobs')->whereRaw('LOWER(exception) LIKE ?', ['%oldco%']);
              echo "failed_jobs matching: ".(clone $jobs)->count()." of ".DB::table('failed_jobs')->count()." total\n";
              echo "failed_jobs deleted: ".$jobs->delete()."\n";
            });
            echo "DONE\n";
            PHP
            php artisan tinker --execute="$(cat /tmp/clear_logs.php)"
            rm -f /tmp/clear_logs.php
