name: Show the last server errors (manual)

# One-off helper, run by hand. Never runs on push. Prints the newest application errors (addresses masked).

on:
  workflow_dispatch:

jobs:
  run:
    name: Last errors
    runs-on: ubuntu-latest
    steps:
      - name: Run on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd ${{ secrets.VPS_PROJECT_PATH }}
            git log --oneline -1
            grep -h "ERROR" storage/logs/laravel-$(date +%F).log 2>/dev/null | tail -6 | cut -c1-420 | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/<email>/g'
            echo "### DONE"
