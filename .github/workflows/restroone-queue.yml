name: Give RestroOne its own queue worker (manual)

# One-off, run by hand. Never runs on push.
# RestroOne's background jobs (queued emails) were going to the shared Redis "default"
# queue, where another app's worker picked them up. This moves RestroOne to its own
# queue name (REDIS_QUEUE=restroone) and starts a worker service that listens only to it.
# Nothing of the other apps is changed (their .env is only read).

on:
  workflow_dispatch:

jobs:
  run:
    name: Own queue worker
    runs-on: ubuntu-latest
    steps:
      - name: Run on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd ${{ secrets.VPS_PROJECT_PATH }}
            echo "service: $(systemctl is-active restroone-queue.service)  enabled: $(systemctl is-enabled restroone-queue.service)"
            echo "failed jobs before: $(php artisan tinker --execute='echo DB::table("failed_jobs")->count();' | tail -1)"
            # Only the three failed test closures from setting this up were there (the count was 0 before).
            php artisan queue:flush
            echo "failed jobs after: $(php artisan tinker --execute='echo DB::table("failed_jobs")->count();' | tail -1)"
            echo "### DONE"
