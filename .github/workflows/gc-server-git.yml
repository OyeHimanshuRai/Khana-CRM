name: Drop old git objects on the server (manual)

# One-off helper, run by hand. Never runs on push.
# After the history rewrite the server's own .git still holds the old commits as
# unreachable objects. Expire them and collect garbage. Working files untouched.

on:
  workflow_dispatch:

jobs:
  gc:
    name: git gc on the server
    runs-on: ubuntu-latest
    steps:
      - name: Run on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd ${{ secrets.VPS_PROJECT_PATH }}
            echo "HEAD: $(git rev-parse --short HEAD)  origin/main: $(git rev-parse --short origin/main)"
            echo "refs:"; git for-each-ref --format='  %(refname)' | head
            echo "commits naming the old company, all refs, BEFORE: $(git log --all -i -S'oldco' --oneline | wc -l)"
            git reflog expire --expire=now --all
            git gc --prune=now --quiet
            echo "commits naming the old company, all refs, AFTER:  $(git log --all -i -S'oldco' --oneline | wc -l)"
            echo "unreachable objects left: $(git count-objects -v | grep -E '^(garbage|count)' | tr '\n' ' ')"
            git status --short | head -3
            echo "### DONE"
