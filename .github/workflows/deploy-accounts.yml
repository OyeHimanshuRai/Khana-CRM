name: Deploy Accounts

# Runs on pushes that touch Accounts or the shared kit, once the server has
# been set up for the three apps (deploy/README.md) and the repository
# variable KHANA_SPLIT_DEPLOYS is not "off". A manual run always goes ahead.

on:
  push:
    branches: [main]
    paths:
      - 'apps/accounts/**'
      - 'packages/kit/**'
      - 'deploy/**'
      - '.github/workflows/deploy-accounts.yml'
      - '.github/workflows/deploy-app.yml'
  workflow_dispatch:

concurrency:
  group: khana-test-accounts
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.KHANA_SPLIT_DEPLOYS != 'off'
    uses: ./.github/workflows/deploy-app.yml
    with:
      app: accounts
    secrets: inherit
