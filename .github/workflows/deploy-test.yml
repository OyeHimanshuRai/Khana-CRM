name: Deploy to test server

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

# One deploy at a time; a push made during a deploy waits for it to finish.
concurrency:
  group: khana-test-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HOST: ${{ secrets.KHANA_TEST_HOST }}

    steps:
      - name: Check the server secrets are set
        env:
          SSH_KEY: ${{ secrets.KHANA_TEST_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.KHANA_TEST_KNOWN_HOSTS }}
        run: |
          if [ -z "$HOST" ] || [ -z "$SSH_KEY" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "::error::Add KHANA_TEST_HOST, KHANA_TEST_SSH_KEY and KHANA_TEST_KNOWN_HOSTS under Settings > Secrets and variables > Actions. See deploy/README.md."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, bcmath, gmp, gd, zip, pdo_mysql
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install PHP packages
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Build CSS and JS
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Upload the build
        env:
          SSH_KEY: ${{ secrets.KHANA_TEST_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.KHANA_TEST_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          rsync -az --delete \
            --exclude=/.git/ --exclude=/.github/ --exclude=/node_modules/ --exclude=/tests/ \
            --exclude=/storage/ --exclude=/.env --exclude=/public/storage \
            ./ "khana@$HOST:/var/www/khana/releases/$GITHUB_SHA/"

      - name: Put it live
        run: ssh "khana@$HOST" "bash -s -- $GITHUB_SHA" < deploy/activate.sh
