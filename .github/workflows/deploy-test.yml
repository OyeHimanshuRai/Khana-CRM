name: Deploy to test server

# Today's single app, which now lives in apps/crm. It stays live at the
# current address until the new CRM (deploy-crm.yml) matches it; switch this
# workflow off then.

on:
  push:
    branches: [main]
    paths:
      - 'apps/crm/**'
      - 'packages/kit/**'
      - 'deploy/**'
      - '.github/workflows/deploy-test.yml'
      - '.github/workflows/deploy-app.yml'
  workflow_dispatch:

# One deploy at a time; a push made during a deploy waits for it to finish.
concurrency:
  group: khana-test-server
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/deploy-app.yml
    with:
      app: legacy
    secrets: inherit
