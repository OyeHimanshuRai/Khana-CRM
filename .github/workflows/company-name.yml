name: Set Company Name to RestroOne (manual)

# One-off helper, run by hand. Never runs on push.
# Changes ONE setting (company_name). Also prints the other brand-name
# settings so they can be reviewed; those are not changed.

on:
  workflow_dispatch:

jobs:
  set:
    name: Set company_name
    runs-on: ubuntu-latest
    steps:
      - name: Update on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd ${{ secrets.VPS_PROJECT_PATH }}
            cat > /tmp/company_name.php <<'PHP'
            use App\Models\Setting;
            foreach (['company_name', 'company_title', 'meta_title_home', 'mail_from_name'] as $k) {
                echo "BEFORE $k = \"".Setting::get($k)."\"\n";
            }
            Setting::put(['company_name' => 'RestroOne', 'mail_from_name' => 'RestroOne']);
            echo "AFTER  company_name = \"".Setting::get('company_name')."\", mail_from_name = \"".Setting::get('mail_from_name')."\"\n";
            PHP
            php artisan tinker --execute="$(cat /tmp/company_name.php)"
            rm -f /tmp/company_name.php
            php artisan cache:clear
