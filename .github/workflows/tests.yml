name: Tests

# Layers 1 and 2 of the test plan on every pull request and every branch
# push: each app's own suite, and the kit's, which includes checking every
# contract sample against its schema.

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  kit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/kit
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, bcmath, pdo_sqlite
          tools: composer:v2
          coverage: none
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/phpunit

  apps:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: [accounts, crm, erp]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    env:
      COMPOSER_MIRROR_PATH_REPOS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, bcmath, gmp, gd, zip, pdo_sqlite
          tools: composer:v2
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test
