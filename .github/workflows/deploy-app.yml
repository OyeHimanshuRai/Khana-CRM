name: Deploy one app

# Called by deploy-accounts.yml, deploy-crm.yml, deploy-erp.yml and
# deploy-test.yml (today's single app, "legacy"). Build, upload over SSH, and
# let deploy/activate.sh migrate, switch and health-check - rolling back if /up
# fails.

on:
  workflow_call:
    inputs:
      app:
        description: accounts, crm, erp or legacy
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HOST: ${{ secrets.KHANA_TEST_HOST }}
      APP: ${{ inputs.app }}
      # legacy is today's app, which now lives in apps/crm.
      APP_DIR: apps/${{ inputs.app == 'legacy' && 'crm' || inputs.app }}
      LINUX_USER: ${{ inputs.app == 'legacy' && 'khana' || format('khana-{0}', inputs.app) }}
      # The kit is a path repository. Copy it into vendor rather than link
      # it, so the uploaded build stands on its own.
      COMPOSER_MIRROR_PATH_REPOS: '1'

    steps:
      - name: Check the server secrets are set
        env:
          SSH_KEY: ${{ secrets.KHANA_TEST_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.KHANA_TEST_KNOWN_HOSTS }}
        run: |
          if [ -z "$HOST" ] || [ -z "$SSH_KEY" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "::error::Add KHANA_TEST_HOST, KHANA_TEST_SSH_KEY and KHANA_TEST_KNOWN_HOSTS under Settings > Secrets and variables > Actions. See deploy/README.md."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, bcmath, gmp, gd, zip, pdo_mysql
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install PHP packages
        working-directory: ${{ env.APP_DIR }}
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Build CSS and JS
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Upload the build
        env:
          SSH_KEY: ${{ secrets.KHANA_TEST_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.KHANA_TEST_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          rsync -az --delete \
            --exclude=/node_modules/ --exclude=/tests/ \
            --exclude=/storage/ --exclude=/.env --exclude=/public/storage \
            "$APP_DIR/" "$LINUX_USER@$HOST:/var/www/$LINUX_USER/releases/$GITHUB_SHA/"

      - name: Put it live
        run: ssh "$LINUX_USER@$HOST" "bash -s -- $APP $GITHUB_SHA" < deploy/activate.sh
