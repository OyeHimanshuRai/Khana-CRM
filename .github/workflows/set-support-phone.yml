name: Set the support phone number (manual)

# One-off, run by hand. Never runs on push. Sets Settings > General > Phone No, which the
# support page, the footer and the invoices read.

on:
  workflow_dispatch:

jobs:
  run:
    name: Support phone
    runs-on: ubuntu-latest
    steps:
      - name: Run on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd ${{ secrets.VPS_PROJECT_PATH }}
            php artisan tinker --execute="echo 'before: '.(\App\Models\Setting::get('phone') ?: '(empty)').PHP_EOL; \App\Models\Setting::put(['phone' => '+91 90547 32126']); echo 'after: '.\App\Models\Setting::get('phone').PHP_EOL;"
            echo "### DONE"
