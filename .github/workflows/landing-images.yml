name: Fill the Landing Page image slots with the built-in pictures (manual)

# One-off helper, run by hand. Never runs on push.
# Copies the built-in illustrations from public/assets/img/landing into
# storage and points the empty Landing Page settings at them. A slot that
# already has an upload is left alone.

on:
  workflow_dispatch:

jobs:
  fill:
    name: Fill empty landing image slots
    runs-on: ubuntu-latest
    steps:
      - name: Update on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd ${{ secrets.VPS_PROJECT_PATH }}
            cat > /tmp/landing_images.php <<'PHP'
            use App\Models\Setting;
            use Illuminate\Support\Facades\Storage;
            $slots = [
                'landing_hero_image' => 'hero.svg',
                'landing_pos_image' => 'shot-pos.svg',
                'landing_billing_image' => 'step-bill.svg',
                'landing_reports_image' => 'shot-reports.svg',
                'landing_step_scan_image' => 'step-scan.svg',
                'landing_step_order_image' => 'step-order.svg',
                'landing_step_kitchen_image' => 'step-kitchen.svg',
                'landing_step_bill_image' => 'step-bill.svg',
            ];
            $disk = Storage::disk('public');
            foreach ($slots as $key => $file) {
                $existing = Setting::get($key);
                if (filled($existing) && $disk->exists($existing)) { echo "KEEP  $key (already has $existing)\n"; continue; }
                $src = public_path('assets/img/landing/'.$file);
                if (! is_file($src)) { echo "MISS  $key: $file not found on server\n"; continue; }
                $dest = 'settings/landing-'.str_replace('_', '-', substr($key, 8)).'.svg';
                $disk->put($dest, file_get_contents($src));
                Setting::put([$key => $dest]);
                echo "SET   $key -> $dest\n";
            }
            echo "DONE\n";
            PHP
            php artisan tinker --execute="$(cat /tmp/landing_images.php)"
            rm -f /tmp/landing_images.php
            chown -R www-data:www-data storage/app/public/settings 2>/dev/null || true
            php artisan cache:clear
